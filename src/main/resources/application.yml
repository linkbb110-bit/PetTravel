spring:
  application:
    name: pettravel
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pet_travel_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

pettravel:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:7d}
  security:
    legacy-plaintext-upgrade-enabled: ${LEGACY_PLAINTEXT_UPGRADE_ENABLED:false}

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME}
    public-base-url: ${ALIYUN_OSS_PUBLIC_BASE_URL:}
    max-file-size: ${ALIYUN_OSS_MAX_FILE_SIZE:10485760}
