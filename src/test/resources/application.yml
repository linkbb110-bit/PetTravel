spring:
  application:
    name: pettravel-test
  datasource:
    url: jdbc:h2:mem:pettravel_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: embedded
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      password: ''

pettravel:
  jwt:
    secret: test-only-jwt-secret-not-for-production-at-least-32-bytes
  security:
    legacy-plaintext-upgrade-enabled: false
  order:
    timeout-scan-initial-delay: 3600000
  inventory:
    recovery-initial-delay: 3600000

aliyun:
  oss:
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    access-key-id: unused
    access-key-secret: unused
    bucket-name: test-bucket
